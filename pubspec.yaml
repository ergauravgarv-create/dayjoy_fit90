name: dayjoy_fit90
description: "Dayjoy Fit90 - 90 Days Weight Transformation Challenge. Transform Yourself. One Day at a Time."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # All dependencies are pinned to EXACT versions (no `^`) as a stand-in for a
  # committed pubspec.lock, so CI stops re-resolving to newer releases between
  # runs. (Transitive deps still float; commit a real pubspec.lock to freeze
  # those too, once you can run `flutter pub get` locally.)
  cupertino_icons: 1.0.6

  # State management. 2.6.x relaxed the rule that a keep-alive provider may not
  # watch an autoDispose provider (which activity_provider relies on), so pin to
  # 2.6.1 — the last 2.x, and what CI was already resolving to.
  flutter_riverpod: 2.6.1

  # Navigation
  go_router: 14.2.0

  # UI / Premium look
  google_fonts: 6.2.1
  fl_chart: 0.68.0
  confetti: 0.7.0

  # Utilities. intl must match the version flutter_localizations pins for the
  # Flutter release (0.19.0 for Flutter 3.24.x) or the solve fails.
  intl: 0.19.0

  # Local on-device storage (used to persist the meal diary across restarts).
  shared_preferences: 2.2.2

  # Local daily reminders (mobile only; web uses a no-op via conditional import).
  flutter_local_notifications: 17.2.3
  timezone: 0.9.4

  # CSV parsing for the bundled clinical diet-chart database.
  csv: 6.0.0

  # Progress photo capture (camera / gallery), stored on-device for now.
  image_picker: 1.1.2

  # Opens reference exercise videos on YouTube (web + mobile).
  url_launcher: 6.3.0

  # Share the branded progress card image via the system share sheet.
  share_plus: 10.0.0

  # Spoken workout cues — announces the next exercise (web + mobile).
  # Pinned to exact versions: without a committed pubspec.lock, CI re-resolves
  # to the latest release each run, and a newer version broke the web build
  # (and forced the Android SDK-36 bump). Pin to stop that drift.
  flutter_tts: 4.0.2

  # Soft chime for the breathing/workout timers (web + mobile).
  audioplayers: 6.1.0

  # ---------------------------------------------------------------
  # Backend (Firebase) — wire these up once you run `flutterfire
  # configure`. The app runs WITHOUT them thanks to the mock
  # repositories (see lib/data/). Uncomment to go live.
  # ---------------------------------------------------------------
  # firebase_core: ^3.3.0
  # firebase_auth: ^5.1.4
  # cloud_firestore: ^5.2.1
  # firebase_storage: ^12.1.3
  # firebase_messaging: ^15.0.4
  # firebase_analytics: ^11.2.1
  # cloud_functions: ^5.0.4

  # ---------------------------------------------------------------
  # Camera & Health (Phase 2 — see docs/camera_health_spec.md)
  # ---------------------------------------------------------------
  # camera: ^0.11.0
  # image: ^4.2.0
  # crypto: ^3.0.3

  # Real step count via Health Connect (Android) / HealthKit (iOS).
  # Only reachable from mobile-guarded code (see platform_health_service_io.dart);
  # the web build never compiles it, so dart2js stays clean.
  health: 11.0.0

  # On-device OCR for medical-report photos (mobile only; web uses a no-op via
  # conditional import). Left as a range — it's newly added, so let pub pick a
  # compatible build first; pin it once a green build reveals the version.
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  # Turns your logo (assets/icon/logo.png) into the app icon at build time.
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n from lib/l10n/*.arb (see l10n.yaml)
  # (Logo is used as the app icon via flutter_launcher_icons, not bundled here.)

  # Bundled image assets (transformation photos, etc.). Drop files into
  # assets/images/ and reference them by path, e.g. 'assets/images/priya_before.jpg'.
  assets:
    - assets/images/
    - assets/data/
    - assets/sounds/

# ---------------------------------------------------------------------------
# App icon generation. Put your company logo at assets/icon/logo.png (a square
# PNG, ideally 1024x1024). The build regenerates the Android launcher icon from
# it automatically. If the file is absent, the default icon is kept.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  # Simplified icon (lotus + DAYJOY + Fit90, fine print removed) fitted inside
  # Android's circular icon mask so the whole mark stays visible and legible.
  # Generated from logo.png. To switch back to the full logo, point these at
  # logo_icon.png / logo_foreground.png instead.
  image_path: "assets/icon/logo_simple_icon.png"
  android: true
  min_sdk_android: 26
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo_simple_foreground.png"
  # iOS/web icons are generated later during those builds; add here when ready:
  # ios: true
  # web:
  #   generated: true
  #   image_path: "assets/icon/logo.png"
