name: dayjoy_fit90
description: "Dayjoy Fit90 - 90 Days Weight Transformation Challenge. Transform Yourself. One Day at a Time."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # UI / Premium look
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  confetti: ^0.7.0

  # Utilities
  # `any` lets pub pick the intl version that flutter_localizations pins for
  # your Flutter release, avoiding version-solve conflicts.
  intl: any

  # ---------------------------------------------------------------
  # Backend (Firebase) — wire these up once you run `flutterfire
  # configure`. The app runs WITHOUT them thanks to the mock
  # repositories (see lib/data/). Uncomment to go live.
  # ---------------------------------------------------------------
  # firebase_core: ^3.3.0
  # firebase_auth: ^5.1.4
  # cloud_firestore: ^5.2.1
  # firebase_storage: ^12.1.3
  # firebase_messaging: ^15.0.4
  # firebase_analytics: ^11.2.1
  # cloud_functions: ^5.0.4

  # ---------------------------------------------------------------
  # Camera & Health (Phase 2 — see docs/camera_health_spec.md)
  # ---------------------------------------------------------------
  # camera: ^0.11.0
  # image: ^4.2.0
  # crypto: ^3.0.3
  # health: ^11.0.0
  # permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n from lib/l10n/*.arb (see l10n.yaml)
  # Add asset folders as you create them:
  # assets:
  #   - assets/images/
  #   - assets/lottie/
