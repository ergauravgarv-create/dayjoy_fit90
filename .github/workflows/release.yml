name: Release

# Builds a signed Android App Bundle and (optionally) deploys Cloud Functions
# when you push a version tag, e.g. `git tag v1.0.0 && git push --tags`.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  android:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Fills in binary scaffolding that cannot be committed (Gradle wrapper
      # jar, default icons). `flutter create` preserves all existing committed
      # files (build.gradle, AndroidManifest, signing config, etc.).
      - name: Generate missing native scaffolding
        run: flutter create --org com.dayjoy --project-name dayjoy_fit90 --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Configure release signing (if secrets provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > android/key.properties
            echo "Release signing configured."
          else
            echo "No keystore secret set — building with debug signing (not for store upload)."
          fi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build
        run: |
          npm install
          npm run build

      - name: Deploy (if FIREBASE_TOKEN provided)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            npx firebase-tools@latest deploy \
              --only functions \
              --project "$FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
          else
            echo "FIREBASE_TOKEN / FIREBASE_PROJECT_ID not set — skipping deploy."
          fi
